        rel="stylesheet">
    <style>
        :root {
            --bg: #06060a;
            --surface: #0d0d14;
            --surface2: #13131d;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.15);
            --accent: #00e87b;
            --accent-dim: rgba(0, 232, 123, 0.15);
            --accent-glow: rgba(0, 232, 123, 0.25);
            --danger: #ff3b5c;
            --warn: #ffb347;
            --blue: #4d8dff;
            --text: #f0f0f5;
            --text2: #9090a8;
            --text3: #5c5c72;
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ═══ NAV ═══ */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            background: rgba(6, 6, 10, 0.85);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo svg {
            opacity: 0.9;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 var(--accent-glow)
            }

            50% {
                opacity: .6;
                box-shadow: 0 0 0 8px transparent
            }
        }

        .nav-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* ═══ METRICS BAR ═══ */
        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 24px 32px;
        }

        .metric {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: border-color 0.2s;
        }

        .metric:hover {
            border-color: var(--border-hover);
        }

        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text3);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .metric-val {
            font-size: 28px;
            font-weight: 800;
        }

        .metric-val.green {
            color: var(--accent);
        }

        /* ═══ MAIN GRID ═══ */
        .main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 0;
            min-height: calc(100vh - 64px - 100px);
        }

        /* ═══ TOOL PANEL (Left) ═══ */
        .tool-panel {
            padding: 0 32px 32px 32px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
        }

        .category {
            margin-bottom: 28px;
        }

        .cat-header {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text3);
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-header span {
            font-size: 16px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }

        .tool-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 232, 123, 0.04);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .tool-btn.running {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .tool-btn .btn-title {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn .btn-desc {
            font-size: 11px;
            color: var(--text3);
            line-height: 1.4;
        }

        .tool-btn .btn-status {
            font-size: 10px;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
            display: none;
        }

        .tool-btn.running .btn-status {
            display: block;
        }

        /* ═══ ACTIVITY LOG (Right) ═══ */
        .activity {
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .activity-header {
            padding: 20px 24px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text3);
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            animation: slideIn 0.3s ease;
        }

        .log-item.success {
            border-left: 3px solid var(--accent);
        }

        .log-item.error {
            border-left: 3px solid var(--danger);
        }

        .log-time {
            font-size: 10px;
            color: var(--text3);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .log-msg {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text2);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ═══ RESULT MODAL ═══ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--surface2);
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }

        .modal-head {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-head h3 {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body pre {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text2);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .modal-foot {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-close,
        .btn-copy {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-close {
            background: transparent;
            color: var(--text2);
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-copy {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .btn-copy:hover {
            opacity: 0.9;
        }

        /* ═══ SCROLLBAR ═══ */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-hover);
            border-radius: 10px;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 900px) {
            .main {
                grid-template-columns: 1fr;
            }

            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }

            .activity {
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: 300px;
            }
        }
    </style>
</head>

            section.className = 'category';

            const header = document.createElement('div');
            header.className = 'cat-header';
            header.innerHTML = `<span>${catName.split(' ')[0]}</span> ${catName.slice(catName.indexOf(' ') + 1)}`;
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'tool-grid';

            for (const [key, info] of Object.entries(tools)) {
                totalTools++;
                const btn = document.createElement('button');
                btn.className = 'tool-btn';
                btn.setAttribute('data-action', key);
                btn.innerHTML = `
                <div class="btn-title">${info.label}</div>
                <div class="btn-desc">${info.desc}</div>
                <div class="btn-status">⏳ Running...</div>
            `;
                btn.onclick = () => runAction(key, info.label, btn);
                grid.appendChild(btn);
            }

            section.appendChild(grid);
            panel.appendChild(section);
        }
        document.getElementById('tool-count').textContent = totalTools;

        // ═══ EXECUTE ACTION ═══
        let lastResult = '';

        async function runAction(key, label, btnEl) {
            btnEl.classList.add('running');
            addLog(`Running: ${label}...`, '');
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 90000);

            try {
                const res = await fetch('/api/nexus/' + key, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}',
                    signal: controller.signal
                });
                clearTimeout(timeout);
                const data = await res.json();
                lastResult = JSON.stringify(data, null, 2);

                const hasError = data.error && !data.output && !data._steps;
                showModal(label, data, hasError ? 'error' : 'success');
                addLog(`${hasError ? '❌' : '✅'} ${label} — ${hasError ? (data.error || "").substring(0, 80) : 'Completed'}`, hasError ? 'error' : 'success');
            } catch (e) {
                clearTimeout(timeout);
                lastResult = e.message;
                showModal(label, { error: e.name === 'AbortError' ? 'Request timed out (90s)' : e.message }, 'error');
                addLog(`❌ ${label} — ${e.name === 'AbortError' ? 'Timeout' : 'Network error'}`, 'error');
            }

            btnEl.classList.remove('running');
        }

        // ═══ RICH VISUAL RENDERER ═══
        function renderRich(data) {
            if (!data || typeof data !== 'object') return `<pre>${String(data)}</pre>`;

            // If server provides explicit steps/visual
            if (data._steps) {
                let html = '<div style="display:flex;flex-direction:column;gap:10px">';
                for (const step of data._steps) {
                    const icon = step.status === 'done' ? '✅' : step.status === 'error' ? '❌' : step.status === 'skip' ? '⏭️' : '🔄';
                    const color = step.status === 'done' ? '#00ff88' : step.status === 'error' ? '#ff4444' : '#888';
                    html += `<div style="padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:8px;border-left:3px solid ${color}">`;
                    html += `<div style="font-weight:600;margin-bottom:4px">${icon} ${esc(step.label)}</div>`;
                    if (step.detail) html += `<div style="font-size:13px;color:#aaa">${esc(step.detail)}</div>`;
                    html += '</div>';
                }
                if (data._summary) html += `<div style="margin-top:8px;padding:12px;background:rgba(0,255,136,0.08);border-radius:8px;font-weight:600">${esc(data._summary)}</div>`;
                html += '</div>';
                return html;
            }

            // Error display
            if (data.error) {
                let html = `<div style="padding:14px;background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.2);border-radius:8px">`;
                html += `<div style="font-weight:600;color:#ff6666;margin-bottom:6px">⚠️ Error</div>`;
                html += `<div style="font-size:13px;color:#ccc">${esc(String(data.error))}</div>`;
                if (data.fix) html += `<div style="margin-top:8px;padding:8px;background:rgba(0,255,136,0.05);border-radius:6px;font-size:12px">💡 ${esc(data.fix)}</div>`;
                html += '</div>';
                return html;
            }

            // Table for flat key-value objects
            const keys = Object.keys(data).filter(k => !k.startsWith('_'));
            if (keys.length > 0 && keys.every(k => typeof data[k] !== 'object')) {
                let html = '<table style="width:100%;border-collapse:collapse">';
                for (const k of keys) {
                    const val = data[k];
                    const displayVal = typeof val === 'number' ? (val % 1 !== 0 ? val.toFixed(6) : val) : val;
                    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.06)">`;
                    html += `<td style="padding:8px 12px;font-size:13px;color:#999;text-transform:uppercase;letter-spacing:0.5px;width:40%">${esc(k.replace(/_/g, ' '))}</td>`;
                    html += `<td style="padding:8px 12px;font-weight:500;font-size:14px">${esc(String(displayVal))}</td>`;
                    html += '</tr>';
                }
                html += '</table>';
                return html;
            }

            // Nested objects — render sections
            let html = '';
            for (const k of keys) {
                html += `<div style="margin-bottom:12px">`;
                html += `<div style="font-size:11px;text-transform:uppercase;color:var(--accent);letter-spacing:1px;margin-bottom:6px">${esc(k.replace(/_/g, ' '))}</div>`;
                if (typeof data[k] === 'object' && data[k] !== null) {
                    html += `<pre style="font-size:12px;color:#bbb;margin:0">${esc(JSON.stringify(data[k], null, 2))}</pre>`;
                } else {
                    html += `<div style="font-size:14px">${esc(String(data[k]))}</div>`;
                }
                html += '</div>';
            }
            return html || `<pre>${esc(JSON.stringify(data, null, 2))}</pre>`;
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        // ═══ MODAL ═══
        function showModal(title, data, status) {
            document.getElementById('modal-title').innerHTML =
                (status === 'error' ? '❌ ' : '✅ ') + title;
            document.getElementById('modal-status').textContent =
                status === 'error' ? 'Error' : 'Success';
            document.getElementById('modal-rich').innerHTML = renderRich(data);
            document.getElementById('modal-content').style.display = 'none';
            document.getElementById('modal').classList.add('open');
        }
        function closeModal() { document.getElementById('modal').classList.remove('open'); }
        function copyResult() { navigator.clipboard.writeText(lastResult); }
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        // ═══ LOG ═══
        function addLog(msg, type) {
            logCount++;
            const list = document.getElementById('logList');
            const now = new Date().toLocaleTimeString('en-GB', { hour12: false });
            const el = document.createElement('div');
            el.className = `log-item ${type || ''}`;
            el.innerHTML = `<div class="log-time">${now}</div><div class="log-msg">${msg}</div>`;
            list.prepend(el);
            if (list.children.length > 50) list.lastChild.remove();
            document.getElementById('log-count').textContent = logCount + ' events';
        }

        // ═══ LIVE METRICS ═══
        async function pollMetrics() {
            try {
                const res = await fetch('/api/nexus/live_metrics');
                if (res.ok) {
                    const m = await res.json();
                    document.getElementById('val-tasks').textContent = m.tasks_completed || 0;
                    document.getElementById('val-rev').textContent = '€' + (m.revenue || '0.00');
                    document.getElementById('val-cpu').textContent = (m.cpu || 0) + '%';
                }
            } catch (e) { }
            setTimeout(pollMetrics, 15000);
        }
        setTimeout(pollMetrics, 2000);

        // Keyboard shortcut: Escape closes modal
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>

</html>
